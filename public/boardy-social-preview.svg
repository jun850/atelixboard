<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Board AI by Atelix</title>
  <desc id="description">A compact Boardy whiteboard with organized ideas, collaborators, and live comments beside the message Turn big ideas into clear next steps.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#e8f1ff"/>
    </linearGradient>
    <linearGradient id="blueWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1769e0"/>
      <stop offset="1" stop-color="#2f6ce5"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#183269" flood-opacity="0.16"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#183269" flood-opacity="0.13"/>
    </filter>
    <clipPath id="boardClip">
      <rect x="520" y="58" width="640" height="514" rx="28"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1110" cy="-12" r="158" fill="#d9e8ff"/>
  <circle cx="70" cy="620" r="176" fill="#dceaff"/>
  <path d="M0 94C151 61 257 74 368 131" fill="none" stroke="#c9ddfb" stroke-width="2" stroke-dasharray="7 12"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(64 58)">
      <rect width="46" height="46" rx="14" fill="#1769e0"/>
      <path d="M13 13h20v14.5H21l-8 6V13Z" fill="none" stroke="#fff" stroke-width="2.8" stroke-linejoin="round"/>
      <text x="60" y="34" fill="#111827" font-size="31" font-weight="700" letter-spacing="-1">Boardy</text>
      <text x="180" y="34" fill="#667085" font-size="18">by Atelix</text>
    </g>

    <g fill="#111827" font-size="53" font-weight="700" letter-spacing="-2.2">
      <text x="64" y="210">Turn big ideas</text>
      <text x="64" y="270">into clear</text>
      <text x="64" y="330">next steps.</text>
    </g>
    <g fill="#667085" font-size="22">
      <text x="64" y="392">Brainstorm, map, comment, and decide</text>
      <text x="64" y="422">together on one focused canvas.</text>
    </g>
    <g transform="translate(64 478)">
      <rect width="176" height="50" rx="25" fill="url(#blueWash)"/>
      <text x="26" y="33" fill="#fff" font-size="20" font-weight="700">boardy.sbs</text>
      <path d="M144 25h14m-5-5 5 5-5 5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="520" y="58" width="640" height="514" rx="28" fill="#fff" stroke="#dfe6f1" stroke-width="2"/>
  </g>
  <g clip-path="url(#boardClip)" font-family="Arial, Helvetica, sans-serif">
    <rect x="520" y="58" width="640" height="62" fill="#fff"/>
    <path d="M520 120h640" stroke="#e5eaf2"/>
    <rect x="542" y="77" width="28" height="28" rx="9" fill="#eaf1ff"/>
    <path d="M550 85h12v9h-7l-5 4V85Z" fill="none" stroke="#1769e0" stroke-width="1.7" stroke-linejoin="round"/>
    <text x="581" y="97" fill="#111827" font-size="16" font-weight="700">Product direction</text>
    <g transform="translate(1012 78)">
      <circle cx="14" cy="14" r="14" fill="#1769e0" stroke="#fff" stroke-width="3"/>
      <text x="14" y="19" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">M</text>
      <circle cx="38" cy="14" r="14" fill="#3d7fa7" stroke="#fff" stroke-width="3"/>
      <text x="38" y="19" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">A</text>
      <circle cx="62" cy="14" r="14" fill="#338262" stroke="#fff" stroke-width="3"/>
      <text x="62" y="19" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">J</text>
    </g>

    <rect x="520" y="120" width="444" height="452" fill="#fbfcff"/>
    <path d="M964 120v452" stroke="#e5eaf2"/>
    <g filter="url(#softShadow)" transform="translate(616 142)">
      <rect width="252" height="42" rx="12" fill="#fff"/>
      <g fill="none" stroke="#667085" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 10 31 18l-7 2-3 7-2-17Z"/>
        <rect x="55" y="11" width="16" height="16" rx="2"/>
        <circle cx="101" cy="19" r="8"/>
        <path d="M132 19h18m-5-5 5 5-5 5"/>
        <path d="M176 11c8 4-5 8 2 16"/>
        <path d="M213 11v16m-7-16h14"/>
      </g>
      <rect x="7" y="5" width="34" height="32" rx="8" fill="#eaf1ff"/>
      <path d="M17 10 30 18l-7 2-3 8-3-18Z" fill="none" stroke="#1769e0" stroke-width="1.8" stroke-linejoin="round"/>
    </g>

    <text x="558" y="230" fill="#111827" font-size="23" font-weight="700">What should we build next?</text>
    <g filter="url(#softShadow)" font-size="15" font-weight="600">
      <g transform="translate(558 260)">
        <rect width="116" height="92" rx="6" fill="#fff1b8"/>
        <text x="14" y="31" fill="#394150">Faster</text>
        <text x="14" y="52" fill="#394150">onboarding</text>
      </g>
      <g transform="translate(692 250)">
        <rect width="116" height="92" rx="6" fill="#dff2e6" stroke="#1769e0" stroke-width="2"/>
        <text x="14" y="31" fill="#394150">Team</text>
        <text x="14" y="52" fill="#394150">templates</text>
        <circle cx="0" cy="0" r="5" fill="#fff" stroke="#1769e0" stroke-width="2"/>
        <circle cx="116" cy="0" r="5" fill="#fff" stroke="#1769e0" stroke-width="2"/>
        <circle cx="0" cy="92" r="5" fill="#fff" stroke="#1769e0" stroke-width="2"/>
        <circle cx="116" cy="92" r="5" fill="#fff" stroke="#1769e0" stroke-width="2"/>
      </g>
      <g transform="translate(826 268)">
        <rect width="104" height="84" rx="6" fill="#e1e9fb"/>
        <text x="13" y="29" fill="#394150">Smart</text>
        <text x="13" y="50" fill="#394150">summaries</text>
      </g>
      <g transform="translate(616 380)">
        <rect width="116" height="86" rx="6" fill="#f7e3e8"/>
        <text x="14" y="31" fill="#394150">Guest</text>
        <text x="14" y="52" fill="#394150">feedback</text>
      </g>
      <g transform="translate(760 390)">
        <rect width="116" height="86" rx="6" fill="#e1e9fb"/>
        <text x="14" y="31" fill="#394150">Board</text>
        <text x="14" y="52" fill="#394150">timeline</text>
      </g>
    </g>
    <path d="M651 366c51 28 98 20 134-9" fill="none" stroke="#1769e0" stroke-width="2.5" stroke-dasharray="7 7" stroke-linecap="round"/>
    <path d="m778 354 9 2-4 8" fill="none" stroke="#1769e0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(888 316)">
      <path d="M0 0 18 12l-10 2-4 11L0 0Z" fill="#1769e0" stroke="#fff" stroke-width="2"/>
      <rect x="14" y="14" width="54" height="24" rx="12" fill="#1769e0"/>
      <text x="41" y="31" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">Maya</text>
    </g>

    <rect x="964" y="120" width="196" height="452" fill="#fff"/>
    <text x="986" y="156" fill="#111827" font-size="17" font-weight="700">Comments</text>
    <g transform="translate(986 182)">
      <circle cx="16" cy="16" r="16" fill="#1769e0"/>
      <text x="16" y="21" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">M</text>
      <text x="42" y="12" fill="#111827" font-size="14" font-weight="700">Maya</text>
      <text x="42" y="31" fill="#7b8498" font-size="12">Just now</text>
      <rect y="50" width="154" height="92" rx="12" fill="#f3f7ff" stroke="#dce6f7"/>
      <g fill="#394150" font-size="13">
        <text x="14" y="76">Love this direction.</text>
        <text x="14" y="95">Let’s turn it into</text>
        <text x="14" y="114">the launch plan.</text>
      </g>
    </g>
    <g transform="translate(986 356)">
      <circle cx="16" cy="16" r="16" fill="#338262"/>
      <text x="16" y="21" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">J</text>
      <text x="42" y="12" fill="#111827" font-size="14" font-weight="700">Jules</text>
      <text x="42" y="31" fill="#7b8498" font-size="12">1 min</text>
      <rect y="50" width="154" height="74" rx="12" fill="#fff" stroke="#dfe6f1"/>
      <g fill="#394150" font-size="13">
        <text x="14" y="77">I’ll map the first</text>
        <text x="14" y="96">flow today.</text>
      </g>
    </g>
    <rect x="982" y="514" width="160" height="38" rx="19" fill="#f8fafc" stroke="#dfe6f1"/>
    <text x="998" y="538" fill="#98a2b3" font-size="13">Reply…</text>
    <circle cx="1123" cy="533" r="14" fill="#1769e0"/>
    <path d="M1118 534h10m-5-5 5 5-5 5" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
